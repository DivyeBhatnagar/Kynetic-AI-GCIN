name: Kynetic AI CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test-and-verify:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kynetic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Check Database Migrations (Upgrade & Downgrade reversibility)
        working-directory: ./backend
        env:
          DATABASE_SYNC_URL: postgresql://postgres:postgrespassword@localhost:5432/kynetic_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/kynetic_test
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run Pytest Test Suite with Coverage
        working-directory: ./backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_ENABLED: "false"
          ENABLE_BILLABLE_EXECUTION: "false"
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Run Benchmark / Performance Test
        working-directory: ./backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_ENABLED: "false"
        run: |
          python tests/load/run_benchmarks.py

      - name: Build Docker Container
        run: |
          docker build -t kynetic-backend:latest ./backend
